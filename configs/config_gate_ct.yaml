EXTENDS: config.yaml

TRAIN_RPFUSE:
  DATA:
    RESULTS_SUFFIX: "_dose_gate"
    USE_DOSE_RESPONSE_GATE: true
    USE_CONV_GATE: true
    USE_VULN_DOSE_RESPONSE: false
    GATE_ASSERT_LEARNABLE: true
    GATE_ASSERT_CURVE: true
    SHOW_PROGRESS: true

  MODEL:
    DOSE_RESPONSE_INIT_GY: 20.0
    DOSE_RESPONSE_TRANSITION_GY: 20.0
    GATE_OFF_INIT: -1.5
    GATE_MIN_CURVE_SPAN: 0.5
    DOSEGATE_LR: 1.0e-3

  TRAINING:
    ACCUMULATION_STEPS: 1
    FOCAL_GAMMA: 2.0

  AUGMENTATION:
    P_ELASTIC: 0.0
    P_GAMMA: 0.0
    P_BLUR: 0.0

TRAIN_GATE_CT:
  WARMUP_UNFREEZE: false
  DOSE_RESPONSE_INIT_GY: 20.0
  SPOTLIGHT: false
  CLAMP_B: null
  FOCAL_GAMMA: 2.0
  EXPORT_EMB: true
  # learnable threshold: pooled feature carries the share of the lung the curve admits,
  # thresholds train at their own constant rate (all four off = the gate reported in the paper)
  VOLUME_FRACTION: true
  VOLUME_FRACTION_SCALE: 10
  THRESH_LR: 1.0e-2
  GATE_LR_CONSTANT: true
